<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Catrachos de Corazón - En Vivo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-card {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .player-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #d4af37; /* Detalle dorado */
        }
        h2 {
            font-size: 18px;
            margin: 10px 0 5px;
        }
        p {
            font-size: 13px;
            color: #aaa;
            margin: 0 0 15px;
        }
        audio {
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <img src="https://public-frontend-1300249583.cos.ap-nanjing.myqcloud.com/commonfile/defautl_logo_dark.png" alt="Radio Catrachos de Corazón">
        <h2>Radio Catrachos de Corazón</h2>
        <p>Transmisión en vivo · 128 kbps</p>
        
        <!-- Elemento de audio conectado a tu servidor -->
        <audio controls preload="none">
            <source src="https://radio.technoplayerserver.com/8010/stream" type="audio/mpeg">
            Tu navegador no soporta el elemento de audio.
        </audio>
    </div>

</body>
</html>
